name: NFTopia Frontend Bundle Size

# Bundle size check runs as its own workflow so a bundle size regression
# is reported as its own distinct required check rather than being buried
# in the build logs. It builds the frontend and runs `size-limit` against
# the per-route and per-chunk budgets defined in .size-limit.js.
on:
  push:
    paths:
      - 'nftopia-frontend/**'
      - '.github/workflows/nftopia-frontend-bundle-size.yml'
    branches: [main, develop]
  pull_request:
    paths:
      - 'nftopia-frontend/**'
      - '.github/workflows/nftopia-frontend-bundle-size.yml'
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: nftopia-frontend-bundle-size-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  bundle-size:
    name: Bundle size budgets
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./nftopia-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect package manager
        id: detect
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "manager=pnpm" >> $GITHUB_OUTPUT
          elif [ -f package-lock.json ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
          else
            echo "No lockfile found. CI requires a lockfile."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ steps.detect.outputs.manager }}
          cache-dependency-path: |
            nftopia-frontend/pnpm-lock.yaml
            nftopia-frontend/package-lock.json

      - name: Setup pnpm
        if: steps.detect.outputs.manager == 'pnpm'
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies (pnpm)
        if: steps.detect.outputs.manager == 'pnpm'
        run: pnpm install --frozen-lockfile

      - name: Install dependencies (npm)
        if: steps.detect.outputs.manager == 'npm'
        run: npm ci

      - name: Build Next.js
        run: |
          if [ "${{ steps.detect.outputs.manager }}" = "pnpm" ]; then
            pnpm run build
          else
            npm run build
          fi

      - name: Run bundle size budget check
        run: |
          if [ "${{ steps.detect.outputs.manager }}" = "pnpm" ]; then
            pnpm run size-limit
          else
            npm run size-limit
          fi

      - name: Generate bundle size summary
        if: always()
        run: |
          node scripts/generate-bundle-summary.js >> $GITHUB_STEP_SUMMARY || true
