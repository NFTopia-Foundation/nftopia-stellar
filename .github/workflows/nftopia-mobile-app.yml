name: NFTopia Mobile App CI/CD

on:
  push:
    paths:
      - 'nftopia-mobile-app/**'
    branches: [main, develop]
  pull_request:
    paths:
      - 'nftopia-mobile-app/**'
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: nftopia-mobile-app-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./nftopia-mobile-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: nftopia-mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint (if available)
        run: npm run lint --if-present

      - name: Run tests (if available)
        run: npm run test --if-present

      - name: Validate Expo config
        run: npx expo config --type public > /dev/null

      - name: Build web bundle (if available)
        run: npm run build --if-present
