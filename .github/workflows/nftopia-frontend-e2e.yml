name: NFTopia Frontend E2E

# Dedicated e2e workflow so Playwright is a separate required check and does not
# block the build/typecheck job on browser setup. `E2E_MOCK_BACKEND=1` makes
# playwright.config.ts boot the fixture auction backend and `npm run dev` itself,
# so the auction bid flow runs without a live backend or a wallet extension.
on:
  pull_request:
    paths:
      - 'nftopia-frontend/**'
      - '.github/workflows/nftopia-frontend-e2e.yml'
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: nftopia-frontend-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  e2e:
    name: E2E (auction bid flow)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./nftopia-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect package manager
        id: detect
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "manager=pnpm" >> $GITHUB_OUTPUT
          elif [ -f package-lock.json ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
          else
            echo "No lockfile found. CI requires a lockfile."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ steps.detect.outputs.manager }}
          cache-dependency-path: |
            nftopia-frontend/pnpm-lock.yaml
            nftopia-frontend/package-lock.json

      - name: Setup pnpm
        if: steps.detect.outputs.manager == 'pnpm'
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies (pnpm)
        if: steps.detect.outputs.manager == 'pnpm'
        run: pnpm install --frozen-lockfile

      - name: Install dependencies (npm)
        if: steps.detect.outputs.manager == 'npm'
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run auction bid flow e2e
        env:
          E2E_MOCK_BACKEND: '1'
        run: npx playwright test e2e/auction-bid-flow.spec.ts

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            nftopia-frontend/playwright-report
            nftopia-frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
